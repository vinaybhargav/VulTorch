[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vultorch"
version = "0.1.0"
description = "High-Performance Pure Vulkan Deep Learning Framework"
readme = "README.md"
authors = [{ name = "Vinay B" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vultorch*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
